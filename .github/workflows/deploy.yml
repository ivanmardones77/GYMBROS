name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npx vite build
      - name: Compress 3D model textures (WebP, max 1024 px)
        run: |
          for f in dist/models/*.glb; do
            size=1024
            case "$(basename "$f")" in food_*) size=512;; esac
            if npx -y @gltf-transform/cli@4 resize "$f" /tmp/r.glb --width $size --height $size \
              && npx -y @gltf-transform/cli@4 webp /tmp/r.glb /tmp/w.glb; then
              mv /tmp/w.glb "$f"
            else
              echo "Keeping original $f"
            fi
          done
          du -sh dist/models
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
